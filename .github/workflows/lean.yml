name: Lean build
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Axiom checker regression tests
        run: python3 .github/test_check_axioms.py
      - uses: leanprover/lean-action@v1
      - name: Compile LoopWirtinger.lean and WirtingerStore.lean from source
        run: |
          lake env lean -o "$RUNNER_TEMP/LoopWirtinger.olean" LoopWirtinger.lean
          lake env lean -o "$RUNNER_TEMP/WirtingerStore.olean" WirtingerStore.lean
      - name: Axiom check
        run: |
          lake env lean CheckAxioms.lean 2>&1 | tee axioms.txt
          python3 .github/check_axioms.py CheckAxioms.lean axioms.txt
      - name: Record the 16 Wirtinger and Riemann checks
        run: python3 .github/record_wirtinger_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: wirtinger-lean-evidence
          path: |
            axioms.txt
            wirtinger-lean-receipt.json
  numerical-gaps:
    name: Five numerical gap checks (separate from Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mpmath==1.3.0
      - name: Replay the registered numerical protocol
        run: python .github/replay_wirtinger_gaps.py
      - uses: actions/upload-artifact@v4
        with:
          name: wirtinger-numerical-evidence
          path: ${{ runner.temp }}/wirtinger-gap-replay/

